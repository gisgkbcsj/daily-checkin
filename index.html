<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b665e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="每日打卡">
<meta name="application-name" content="每日打卡">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>每日打卡</title>
<style>
  html,body{margin:0;height:100%}
  body{background:#f2f0ea;color:#5a646d;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
  .w{text-align:center}
  .w .ic{width:78px;height:78px;margin:0 auto 16px}
  .w .ic svg{width:100%;height:100%;display:block;border-radius:19px}
  .w p{margin:0;font-size:14.5px}
  .w a{display:inline-block;margin-top:16px;font-size:14px;color:#2b665e;text-decoration:none;
    border:1px solid #e5e0d6;background:#fff;border-radius:10px;padding:9px 16px}
</style>
</head>
<body>
<div class="w">
  <div class="ic">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
      <rect width="192" height="192" fill="#2b665e"/>
      <circle cx="96" cy="106" r="62" fill="none" stroke="#fff" stroke-width="7" opacity=".32"/>
      <path d="M96 88 C104 67 128 58 152 63" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".95"/>
      <path d="M96 110 C87 131 63 140 40 133" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round"/>
      <circle cx="96" cy="101" r="13" fill="#fff"/>
    </svg>
  </div>
  <p id="tip">正在进入…</p>
  <a id="manual" href="下一步.html" style="display:none">点这里进入</a>
</div>

<script>
/* 入口页：
   平时直接进入「接下来」（一次只显示当前该做的一件事）。
   如果上次你看的是日历/记录页，就进入日历，保持你的习惯。 */
(function(){
  var KEY = 'breath-checkin-v1';
  var target = 'app.html';
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      if(o && o.settings && o.settings.lastView === 'top'){ target = '下一步.html'; }
    }else{
      target = '下一步.html';            /* 第一次打开：进「接下来」 */
    }
  }catch(e){ target = '下一步.html'; }

  document.getElementById('tip').textContent = '正在进入…';
  /* 兜底：2 秒后如果还没跳走，显示手动入口 */
  var t = setTimeout(function(){
    var a = document.getElementById('manual');
    a.href = target; a.style.display = 'inline-block';
    document.getElementById('tip').textContent = '没能自动跳转，请手动点';
  }, 2000);

  location.replace(target);
})();
</script>
</body>
</html>
